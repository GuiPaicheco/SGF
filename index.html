<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sistema auxiliar de solicitações de férias e folgas da Prefeitura Municipal de Betim.">
  <meta name="theme-color" content="#123c2f"><title>SGF — Prefeitura de Betim</title>
  <link rel="icon" href="logo.png"><link rel="stylesheet" href="assets/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Ir para o conteúdo</a>
  <header class="site-header"><div class="header-inner">
    <img src="logo.png" alt="Prefeitura Municipal de Betim" class="brand-logo">
    <div class="brand-copy"><strong>SGF</strong><span>Sistema de Gestão de Férias e Folgas</span></div>
    <button id="session-action" class="button button-ghost hidden" type="button">Sair</button>
  </div></header>
  <div id="progress" class="progress" aria-live="polite"></div>
  <main id="app" class="app" tabindex="-1"><section class="card loading-card" aria-busy="true"><div class="spinner"></div><p>Preparando o sistema…</p></section></main>
  <footer class="site-footer"><span>Prefeitura Municipal de Betim</span><span>Sistema auxiliar — a concessão depende de autorização administrativa.</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
