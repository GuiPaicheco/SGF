/* =========================================================

   ========================================================= */
const state = {

/* =========================================================
   DATAS
   ========================================================= */
function pad(n) { return String(n).padStart(2, '0'); }

function toISO(date) {
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function fromISO(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDate(date) {
  return date ? date.toLocaleDateString('pt-BR') : '—';
}

function formatInputDate(iso) {
  return iso ? formatDate(fromISO(iso)) : '';
}

function cloneDate(d) {
  return new Date(d.getTime());
}

function addCalendarDays(date, amount) {
  const d = cloneDate(date);
  d.setDate(d.getDate() + amount);
  return d;
}

function holidayInfo(date) {
  const item = calendarioBetim.find(x => x[0] === toISO(date));
  return item ? { tipo: item[1], nome: item[2] } : null;
}

function isWeekend(date) {
  const day = date.getDay();
  return day === 0 || day === 6;
}

function isBusinessDay(date) {
  return !isWeekend(date) && holidayInfo(date)?.tipo !== 'feriado';
}

function addBusinessDaysInclusive(start, numberOfDays) {
  let cursor = cloneDate(start), count = 0;
  while (true) {
    if (isBusinessDay(cursor)) {
      count++;
      if (count === numberOfDays) return cursor;
    }
    cursor.setDate(cursor.getDate()+1);
  }
}

function subtractBusinessDaysForStart(returnDate, numberOfDays) {
  let cursor = cloneDate(returnDate);
  let count = 0;
  cursor.setDate(cursor.getDate()-1);
  while (true) {
    if (isBusinessDay(cursor)) {
      count++;
      if (count === numberOfDays) return cursor;
    }
    cursor.setDate(cursor.getDate()-1);
  }
}

function nextWorkDay(date) {
  let d = cloneDate(date);
  while (!isBusinessDay(d)) d = addCalendarDays(d, 1);
  return d;
}

function minStartDate() {
  const today = new Date();
  today.setHours(0,0,0,0);
  return addCalendarDays(today, state.answers.reprogramacao
    ? CONFIG.antecedenciaReprogramacao
    : CONFIG.antecedenciaFerias);
}

/* =========================================================
   REGRAS
   ========================================================= */
function isNewRegularRule() {
  const fim = state.answers.periodAquisitivoFim;
  return fim && fim >= CONFIG.inicioNovaRegra;
}

function currentRegularRule() {
  const isEffective = state.answers.vinculo === 'efetivo';

  if (!isNewRegularRule()) {
    return {
      label: 'Férias Regulamentares',
      total: CONFIG.feriasAntigasDias,
      unit: 'corridos',
      regime: 'anterior',
      fractionAllowed: true
    };
  }

  if (state.answers.faltas === true) {
    return {
      label: 'Férias Regulamentares',
      total: CONFIG.feriasReduzidasDias,
      unit: 'úteis',
      regime: 'novo',
      fractionAllowed: false
    };
  }

  return {
    label: 'Férias Regulamentares',
    total: CONFIG.feriasNovasDias,
    unit: 'úteis',
    regime: 'novo',
    fractionAllowed: isEffective
  };
}

function currentRule() {
  if (state.answers.tipo === 'premio') {
    return {
      label: 'Férias-Prêmio',
      total: state.answers.premioDias || 0,
      unit: 'corridos',
      regime: 'premio',
      fractionAllowed: true
    };
  }
  return currentRegularRule();
}

function calculatePeriod(start, days, unit) {
  let end;

  if (unit === 'corridos') {
    end = addCalendarDays(start, days - 1);
  } else {
    end = addBusinessDaysInclusive(start, days);
  }

  const returnDate = nextWorkDay(addCalendarDays(end, 1));
  return { start: cloneDate(start), end, returnDate, days, unit };
}

function datesAreValid(start) {
  if (!start) return false;
  return start >= minStartDate();
}

function calculatePeriods() {
  state.periods = [];
  state.returnDates = [];

  const rule = currentRule();
  if (!rule.total) return;

  if (state.answers.tipo === 'regular' &&
      isNewRegularRule() &&
      state.answers.fracionar === true &&
      state.answers.vinculo === 'efetivo' &&
      state.answers.faltas === false) {

    if (state.selectedStart) {
      const firstDays = Number(state.answers.fracaoPrimeiro);
      const secondDays = 25 - firstDays;
      const first = calculatePeriod(state.selectedStart, firstDays, 'úteis');
      state.periods.push(first);
    }
    if (state.selectedSecondStart) {
      const firstDays = Number(state.answers.fracaoPrimeiro);
      const secondDays = 25 - firstDays;
      const firstEnd = state.periods[0]?.end;
      if (firstEnd && state.selectedSecondStart <= firstEnd) {
        state.selectedSecondStart = null;
        return;
      }
      const second = calculatePeriod(state.selectedSecondStart, secondDays, 'úteis');
      state.periods.push(second);
    }
  } else if (state.selectedStart) {
    state.periods.push(calculatePeriod(state.selectedStart, rule.total, rule.unit));
  }

  state.returnDates = state.periods.map(p => p.returnDate);
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
function setProgress(label) {
  progress.textContent = label;
}

function go(screen, push = true) {
  if (push && state.screen !== screen) state.history.push(state.screen);
  state.screen = screen;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function back() {
  if (state.history.length) {
    state.screen = state.history.pop();
    render();
  } else {
    go('inicio', false);
  }
}

function restart() {
  location.reload();
}

/* =========================================================
   COMPONENTES
   ========================================================= */
function shell(content) {
  return `<div class="fade-in rounded-3xl bg-white p-4 shadow-sm ring-1 ring-slate-200 sm:p-8">${content}</div>`;
}

function field(label, id, value='', type='text', placeholder='', required=true, hint='') {

    <label class="block">
      <span class="mb-2 block text-sm font-semibold text-slate-700">${label}${required ? ' <span class="text-slate-400">*</span>' : ''}</span>

        placeholder="${placeholder}"
        class="touch w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-[15px] outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:bg-white" />
      ${hint ? `<span class="mt-1.5 block text-[11px] leading-5 text-slate-400">${hint}</span>` : ''}
    </label>
  `;
}

function selectField(label, id, value, options, required=true) {

        <option value="">Selecione</option>
        ${options.map(([v,t]) => `<option value="${v}" ${String(v)===String(value)?'selected':''}>${t}</option>`).join('')}
      </select>
    </label>
  `;
}

function actionButton(label, action, primary=true, extra='') {

}

/* =========================================================

  if (state.screen === 'final') return renderFinal();

function onlyDigits(value) {
  return String(value || '').replace(/\D/g, '');
}

function formatCPF(value) {
  const digits = onlyDigits(value).slice(0, 11);

  if (digits.length <= 3) return digits;
  if (digits.length <= 6) return `${digits.slice(0,3)}.${digits.slice(3)}`;
  if (digits.length <= 9) return `${digits.slice(0,3)}.${digits.slice(3,6)}.${digits.slice(6)}`;
  return `${digits.slice(0,3)}.${digits.slice(3,6)}.${digits.slice(6,9)}-${digits.slice(9,11)}`;
}

function validateCPF(value) {
  const cpf = onlyDigits(value);
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

  let sum = 0;
  for (let i=0; i<9; i++) sum += Number(cpf[i]) * (10-i);
  let digit = (sum * 10) % 11;
  if (digit === 10) digit = 0;
  if (digit !== Number(cpf[9])) return false;

  sum = 0;
  for (let i=0; i<10; i++) sum += Number(cpf[i]) * (11-i);
  digit = (sum * 10) % 11;
  if (digit === 10) digit = 0;
  return digit === Number(cpf[10]);
}

function formatName(value) {
  return String(value || '')
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/\b([a-zà-ÿ])/gi, (m) => m.toUpperCase());
}

function validISODate(value) {
  if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = fromISO(value);
  return toISO(d) === value;
}

function todayStart() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function validateServidorDados(values) {
  const errors = [];
  const today = todayStart();

  if (!values.nome || values.nome.length < 5) {
    errors.push('Informe o nome completo do servidor.');
  }

  if (!validateCPF(values.cpf)) {
    errors.push('Informe um CPF válido.');
  }

  if (!validISODate(values.nascimento)) {
    errors.push('Informe uma data de nascimento válida.');
  } else {
    const nascimento = fromISO(values.nascimento);
    if (nascimento > today) errors.push('A data de nascimento não pode ser posterior à data de hoje.');
  }

  if (!values.matricula) errors.push('Informe a matrícula.');
  if (!values.vinculo) errors.push('Selecione o vínculo.');

  if (!validISODate(values.dataAdmissao)) {
    errors.push('Informe uma data de admissão válida.');
  } else {
    const admissao = fromISO(values.dataAdmissao);
    if (admissao > today) errors.push('A data de admissão não pode ser posterior à data de hoje.');

    if (validISODate(values.nascimento) && admissao < fromISO(values.nascimento)) {
      errors.push('A data de admissão não pode ser anterior à data de nascimento.');
    }
  }

  if (!values.cargo) errors.push('Informe o cargo.');
  if (!values.funcao) errors.push('Informe a função/atividade.');
  if (!values.lotacao) errors.push('Informe a lotação.');

  return errors;
}

/* =========================================================
   CALENDÁRIO
   ========================================================= */
function calendarMonthHtml() {
  const y = state.currentMonth.getFullYear();
  const m = state.currentMonth.getMonth();
  const first = new Date(y,m,1);
  const total = new Date(y,m+1,0).getDate();
  const min = minStartDate();
  const cells = [];

  for (let i=0;i<first.getDay();i++) cells.push('<div></div>');

  for (let d=1;d<=total;d++) {
    const date = new Date(y,m,d);
    const iso = toISO(date);
    const h = holidayInfo(date);
    const weekend = isWeekend(date);
    const locked = date < min;
    const isFirst = state.selectedStart && iso === toISO(state.selectedStart);
    const isSecond = state.selectedSecondStart && iso === toISO(state.selectedSecondStart);

    const inFirst = state.periods[0] && date >= state.periods[0].start && date <= state.periods[0].end;
    const inSecond = state.periods[1] && date >= state.periods[1].start && date <= state.periods[1].end;

    const isReturn = state.returnDates.some(r => toISO(r) === iso);

    let cls = 'text-slate-700';
    if (locked) cls += ' opacity-30';
    else if (weekend) cls += ' text-slate-400';
    if (inFirst || inSecond) cls += ' bg-slate-900 text-white';
    if (isReturn && !inFirst && !inSecond) cls += ' bg-emerald-100 text-emerald-900';
    if (h?.tipo === 'feriado' && !inFirst && !inSecond) cls += ' bg-amber-50 text-amber-800';
    if (isFirst || isSecond) cls += ' ring-2 ring-slate-900 ring-offset-1';

    cells.push(`
      <button ${locked?'disabled':''} data-date="${iso}" data-action="calendar:date"
        title="${locked?'Data bloqueada pela antecedência mínima':h?`${h.tipo==='feriado'?'Feriado':'Ponto facultativo'} — ${h.nome}`:weekend?'Fim de semana':''}"
        class="day-btn rounded-xl border border-transparent p-1 text-sm font-semibold transition hover:border-slate-300 ${cls}">
        ${d}
        ${h ? `<span class="mx-auto mt-0.5 block h-1 w-1 rounded-full ${h.tipo==='feriado'?'bg-amber-500':'bg-blue-500'}"></span>` : '<span class="mx-auto mt-0.5 block h-1 w-1 rounded-full opacity-0"></span>'}
      </button>
    `);
  }

  return `
    <div class="overflow-hidden rounded-3xl border border-slate-200 bg-white">
      <div class="flex items-center justify-between border-b border-slate-100 px-3 py-3 sm:px-5">
        <button data-action="month:prev" class="touch grid h-10 w-10 place-items-center rounded-xl border border-slate-200">←</button>
        <div class="text-center">
          <div class="font-bold capitalize">${state.currentMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div>
          <div class="text-[10px] text-slate-400">Mínimo: ${formatDate(min)}</div>
        </div>
        <button data-action="month:next" class="touch grid h-10 w-10 place-items-center rounded-xl border border-slate-200">→</button>
      </div>
      <div class="grid calendar-grid gap-1 px-2 py-3 text-center text-[10px] font-semibold uppercase text-slate-400">
        ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div>${x}</div>`).join('')}
      </div>
      <div class="grid calendar-grid gap-1 px-2 pb-3 sm:gap-2 sm:px-4 sm:pb-4">${cells.join('')}</div>
      <div class="flex flex-wrap gap-x-3 gap-y-1 border-t border-slate-100 px-3 py-3 text-[10px] text-slate-500 sm:px-5">
        <span>■ Férias</span><span class="text-amber-700">● Feriado</span><span class="text-blue-600">● Ponto facultativo</span><span class="text-emerald-700">■ Retorno</span>
      </div>
    </div>
  `;
}

function buildRequestText() {
  const a = state.answers;
  const rule = currentRule();
  const lines = [];
  lines.push(`SOLICITAÇÃO DE ${rule.label.toUpperCase()}`);
  lines.push('');
  lines.push(`Servidor(a): ${a.nome}`);
  lines.push(`CPF: ${a.cpf}`);
  lines.push(`Data de nascimento: ${formatInputDate(a.nascimento)}`);
  lines.push(`Matrícula: ${a.matricula}`);
  lines.push(`Vínculo: ${vinculoLabel(a.vinculo)}`);
  lines.push(`Cargo: ${a.cargo}`);
  lines.push(`Função/atividade: ${a.funcao}`);
  lines.push(`Lotação: ${a.lotacao}`);
  lines.push('');
  if (state.periods.length === 1) {
    const p = state.periods[0];
    lines.push(`Período solicitado: ${formatDate(p.start)} a ${formatDate(p.end)}`);
    lines.push(`Retorno previsto: ${formatDate(p.returnDate)}`);
  } else {
    state.periods.forEach((p,i)=>{
      lines.push(`${i+1}º período: ${formatDate(p.start)} a ${formatDate(p.end)} — retorno ${formatDate(p.returnDate)}`);
    });
  }
  lines.push('');
  lines.push('Solicito o encaminhamento desta solicitação ao RH da lotação para análise e programação das férias.');
  lines.push('');
  lines.push('Declaro estar ciente de que esta ferramenta apenas auxilia na preparação do pedido e que a concessão das férias depende da análise e autorização administrativa competente.');
  lines.push('');
  lines.push(`Data da solicitação: ${formatDate(new Date())}`);
  return lines.join('\n');
}

function vinculoLabel(v) {
  return ({
    efetivo:'Servidor efetivo',
    comissionado:'Comissionado sem vínculo efetivo',
    contratado:'Contratado',
    funcao_publica:'Função pública'
  })[v] || v;
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function downloadSpreadsheet() {
  if (typeof XLSX === 'undefined') {
    showToast('A biblioteca de planilha não foi carregada. Verifique a conexão e tente novamente.');
    return;
  }

  const a = state.answers;
  const rule = currentRule();

  const rows = [
    ['SOLICITAÇÃO DE FÉRIAS — CONTROLE DE SOLICITAÇÃO'],
    [],
    ['DADOS DO SERVIDOR','VALOR'],
    ['Nome completo', a.nome],
    ['CPF', a.cpf],
    ['Data de nascimento', formatInputDate(a.nascimento)],
    ['Matrícula', a.matricula],
    ['Vínculo', vinculoLabel(a.vinculo)],
    ['Data de admissão', formatInputDate(a.dataAdmissao)],
    ['Cargo', a.cargo],
    ['Função / atividade', a.funcao],
    ['Lotação', a.lotacao],
    [],
    ['DADOS DAS FÉRIAS','VALOR'],
    ['Tipo', rule.label],
    ['Regime', rule.regime === 'novo' ? 'Novo regime' : rule.regime === 'anterior' ? 'Regra anterior' : 'Férias-prêmio'],
    ['Período aquisitivo — final', formatInputDate(a.periodAquisitivoFim)],
    ['Faltas > 9 injustificadas', a.faltas === true ? 'Sim' : a.faltas === false ? 'Não' : 'Não se aplica'],
    ['Fracionamento', a.fracionar === true ? 'Sim' : a.fracionar === false ? 'Não' : 'Não se aplica'],
    ['Antecedência', `${a.reprogramacao ? CONFIG.antecedenciaReprogramacao : CONFIG.antecedenciaFerias} dias`],
    []
  ];

  state.periods.forEach((p,i)=>{
    rows.push([
      state.periods.length > 1 ? `${i+1}º período — Início` : 'Início',
      formatDate(p.start)
    ]);
    rows.push([
      state.periods.length > 1 ? `${i+1}º período — Fim` : 'Fim',
      formatDate(p.end)
    ]);
    rows.push([
      state.periods.length > 1 ? `${i+1}º período — Retorno` : 'Retorno',
      formatDate(p.returnDate)
    ]);
  });

  rows.push([]);
  rows.push(['STATUS','PENDÊNCIA / AÇÃO']);
  rows.push(['Para o RH','Receber e analisar esta solicitação.']);
  rows.push(['Observação','Este arquivo auxilia o controle interno e não representa autorização de férias.']);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:34},{wch:48}];

  // Tabela adicional compacta, uma linha por servidor, útil para o controle mensal.
  const resumo = [
    ['Nome','CPF','Matrícula','Nascimento','Lotação','Cargo','Função','Tipo de férias','1º início','1º fim','1º retorno','2º início','2º fim','2º retorno','Status'],
    [
      a.nome,a.cpf,a.matricula,formatInputDate(a.nascimento),a.lotacao,a.cargo,a.funcao,rule.label,
      state.periods[0] ? formatDate(state.periods[0].start) : '',
      state.periods[0] ? formatDate(state.periods[0].end) : '',
      state.periods[0] ? formatDate(state.periods[0].returnDate) : '',
      state.periods[1] ? formatDate(state.periods[1].start) : '',
      state.periods[1] ? formatDate(state.periods[1].end) : '',
      state.periods[1] ? formatDate(state.periods[1].returnDate) : '',
      'Solicitação preparada'
    ]
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(resumo);
  ws2['!cols'] = [
    {wch:28},{wch:18},{wch:16},{wch:15},{wch:25},{wch:30},{wch:28},{wch:24},
    {wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:24}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Solicitação');
  XLSX.utils.book_append_sheet(wb, ws2, 'Controle RH');

  XLSX.writeFile(wb, `SolicitacaoDeFerias_${safeFilename(a.nome)}_${toISO(new Date())}.xlsx`);
  showToast('Planilha baixada.');
}

function safeFilename(name) {
  return String(name || 'servidor')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9_-]+/g,'_')
    .replace(/^_+|_+$/g,'')
    .slice(0,60) || 'servidor';
}

function showToast(message) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded-2xl bg-slate-900 px-4 py-3 text-xs font-semibold text-white shadow-xl';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

app.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-action]');
  if (!btn) return;

  const action = btn.dataset.action;

  if (action === 'back') {
    back();
    return;
  }

  if (action === 'inicio:continuar') {
    go('tipo');
    return;
  }

  if (action === 'inicio:novo') {
    restart();
    return;
  }

  if (action === 'tipo:regular') {
    state.answers.tipo = 'regular';
    state.answers.reprogramacao = false;
    go('dados');
    return;
  }

  if (action === 'tipo:premio') {
    state.answers.tipo = 'premio';
    go('dados');
    return;
  }

  if (action === 'dados:continuar') {
    const ids = ['nome','cpf','nascimento','matricula','vinculo','dataAdmissao','cargo','funcao','lotacao'];
    const values = Object.fromEntries(ids.map(id => [id, document.getElementById(id)?.value.trim() || '']));

    values.nome = formatName(values.nome);
    values.cpf = formatCPF(values.cpf);
    values.matricula = values.matricula.replace(/\s+/g, ' ').trim();
    values.cargo = values.cargo.replace(/\s+/g, ' ').trim();
    values.funcao = values.funcao.replace(/\s+/g, ' ').trim();
    values.lotacao = values.lotacao.replace(/\s+/g, ' ').trim();

    const errors = validateServidorDados(values);
    if (errors.length) {
      showToast(errors[0]);
      return;
    }

    Object.assign(state.answers, values);

    // O vínculo já informa se o servidor é efetivo.
    state.answers.efetivo = state.answers.vinculo === 'efetivo';

    // Fracionamento novo é exclusivo do servidor efetivo; evite estado residual.
    if (!state.answers.efetivo) {
      state.answers.fracionar = false;
      state.answers.fracaoPrimeiro = null;
    }

    go('periodo');
    return;
  }

  if (action === 'periodo:continuar') {
    const val = document.getElementById('periodAquisitivoFim')?.value || '';
    const today = todayStart();

    if (!validISODate(val)) {
      showToast('Informe uma data válida para o término do período aquisitivo.');
      return;
    }

    const fim = fromISO(val);
    const admissao = validISODate(state.answers.dataAdmissao) ? fromISO(state.answers.dataAdmissao) : null;

    if (fim > today) {
      showToast('O período aquisitivo informado ainda não terminou.');
      return;
    }

    if (admissao && fim < admissao) {
      showToast('A data de término do período aquisitivo não pode ser anterior à admissão.');
      return;
    }

    state.answers.periodAquisitivoFim = val;
    go('regras');
    return;
  }

  if (action === 'premio:confirmado') {
    state.answers.premioDireitoConfirmado = true;
    go('regras');
    return;
  }

  if (action === 'premio:nao-confirmado') {
    state.answers.premioDireitoConfirmado = false;
    go('premio-bloqueado');
    return;
  }

  if (action === 'premio:dias30') {
    state.answers.premioDias = 30;
    go('calendario');
    return;
  }

  if (action === 'premio:dias60') {
    state.answers.premioDias = 60;
    go('calendario');
    return;
  }

  if (action === 'faltas:nao') {
    state.answers.faltas = false;
    render();
    return;
  }

  if (action === 'faltas:sim') {
    state.answers.faltas = true;
    state.answers.fracionar = false;
    render();
    return;
  }

  if (action === 'efetivo:sim') {
    state.answers.efetivo = true;
    render();
    return;
  }

  if (action === 'efetivo:nao') {
    state.answers.efetivo = false;
    state.answers.fracionar = false;
    render();
    return;
  }

  if (action === 'fracionar:nao') {
    state.answers.fracionar = false;
    go('regras', false);
    render();
    return;
  }

  if (action === 'fracionar:sim') {
    state.answers.fracionar = true;
    render();
    return;
  }

  if (action === 'fracao:15') {
    state.answers.fracaoPrimeiro = 15;
    go('calendario');
    return;
  }

  if (action === 'fracao:10') {
    state.answers.fracaoPrimeiro = 10;
    go('calendario');
    return;
  }

  if (action === 'regras:continuar') {
    go('calendario');
    return;
  }

  if (action === 'month:prev') {
    state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth()-1, 1);
    render();
    return;
  }

  if (action === 'month:next') {
    state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth()+1, 1);
    render();
    return;
  }

  if (action === 'calendar:clear') {
    state.selectedStart = null;
    state.selectedSecondStart = null;
    state.periods = [];
    state.returnDates = [];
    render();
    return;
  }

  if (action === 'calendar:date') {
    const date = fromISO(btn.dataset.date);

    const isFraction = state.answers.tipo === 'regular' &&
      isNewRegularRule() &&
      state.answers.fracionar === true &&
      state.answers.vinculo === 'efetivo' &&
      state.answers.faltas === false;

    if (date < minStartDate()) {
      showToast(`Data bloqueada: mínimo de ${state.answers.reprogramacao ? 45 : 60} dias de antecedência.`);
      return;
    }

    if (!isFraction) {
      state.selectedStart = date;
    } else if (!state.selectedStart) {
      state.selectedStart = date;
    } else if (!state.selectedSecondStart) {
      calculatePeriods();
      const firstEnd = state.periods[0]?.end;
      if (firstEnd && date <= firstEnd) {
        showToast('O 2º período não pode começar antes do término do 1º.');
        return;
      }
      state.selectedSecondStart = date;
    } else {
      state.selectedStart = date;
      state.selectedSecondStart = null;
    }

    calculatePeriods();
    render();
    return;
  }

  if (action === 'calendar:continue') {
    const isFraction = state.answers.tipo === 'regular' &&
      isNewRegularRule() &&
      state.answers.fracionar === true &&
      state.answers.vinculo === 'efetivo' &&
      state.answers.faltas === false;

    if (!state.selectedStart || (isFraction && !state.selectedSecondStart)) {
      showToast(isFraction ? 'Defina os dois períodos.' : 'Escolha a data de início.');
      return;
    }

    calculatePeriods();

    // Validar antecedência de todos os períodos
    const invalid = state.periods.find(p => p.start < minStartDate());
    if (invalid) {
      showToast('Uma das datas não respeita a antecedência mínima.');
      return;
    }

    go('confirmacao');
    return;
  }

  if (action === 'confirmar:final') {
    calculatePeriods();
    go('final');
    return;
  }

  if (action === 'copy:text') {
    const text = buildRequestText().replace(/\\r?\\n/g, '\n');
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast('Solicitação copiada para a área de transferência.'),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
    return;
  }

  if (action === 'xlsx:download') {
    downloadSpreadsheet();
    return;
  }

  if (action === 'print') {
    window.print();
    return;
  }
});


app.addEventListener('input', (event) => {
  const el = event.target;

  if (el.id === 'cpf') {
    const rawBefore = el.value;
    const caretBefore = el.selectionStart ?? rawBefore.length;

    // Quantidade de dígitos existentes antes do cursor.
    const digitsBeforeCaret = rawBefore.slice(0, caretBefore).replace(/\D/g, '').length;

    const formatted = formatCPF(rawBefore);
    el.value = formatted;

    // Reposiciona o cursor pelo número de dígitos, sem "pular" para o final.
    let pos = 0;
    let seen = 0;
    while (pos < formatted.length && seen < digitsBeforeCaret) {
      if (/\d/.test(formatted[pos])) seen++;
      pos++;
    }
    el.setSelectionRange(pos, pos);
  }
});


app.addEventListener('blur', (event) => {
  const el = event.target;
  if (el.id === 'cpf' && el.value) {
    const valid = validateCPF(el.value);
    el.setCustomValidity(valid ? '' : 'Digite um CPF válido.');
    el.classList.toggle('border-red-300', !valid);
    el.classList.toggle('bg-red-50', !valid);
    el.classList.toggle('border-slate-200', valid);
    el.classList.toggle('bg-slate-50', valid);
  }
}, true);

app.addEventListener('change', (event) => {
  const el = event.target;

  if (el.id === 'nascimento' || el.id === 'dataAdmissao' || el.id === 'periodAquisitivoFim') {
    if (!el.value) return;

    if (!validISODate(el.value)) {
      el.setCustomValidity('Informe uma data válida.');
      return;
    }

    const today = todayStart();
    const date = fromISO(el.value);

    if (el.id === 'nascimento' && date > today) {
      el.setCustomValidity('A data de nascimento não pode ser futura.');
      showToast('A data de nascimento não pode ser futura.');
      return;
    }

    if (el.id === 'dataAdmissao' && date > today) {
      el.setCustomValidity('A data de admissão não pode ser futura.');
      showToast('A data de admissão não pode ser futura.');
      return;
    }

    if (el.id === 'dataAdmissao') {
      const nascimento = document.getElementById('nascimento')?.value;
      if (validISODate(nascimento) && date < fromISO(nascimento)) {
        el.setCustomValidity('A admissão não pode ser anterior ao nascimento.');
        showToast('A data de admissão não pode ser anterior ao nascimento.');
        return;
      }
    }

    if (el.id === 'periodAquisitivoFim') {
      const admissao = state.answers.dataAdmissao;
      if (validISODate(admissao) && date < fromISO(admissao)) {
        el.setCustomValidity('O término do período aquisitivo não pode ser anterior à admissão.');
        showToast('O período aquisitivo não pode terminar antes da admissão.');
        return;
      }
      if (date > today) {
        el.setCustomValidity('O período aquisitivo informado ainda não terminou.');
        showToast('O período aquisitivo informado ainda não terminou.');
        return;
      }
    }

    el.setCustomValidity('');
  }

  if (el.id === 'nome' || el.id === 'cargo' || el.id === 'funcao' || el.id === 'matricula' || el.id === 'lotacao') {
    el.value = el.value.replace(/\s{2,}/g, ' ');
  }
});

function fallbackCopy(text) {
  const area = document.createElement('textarea');
  area.value = text;
  document.body.appendChild(area);
  area.select();
  document.execCommand('copy');
  area.remove();
  showToast('Solicitação copiada.');
}
