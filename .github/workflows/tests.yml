name: Testes do SGF

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Executar testes automatizados
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validar consulta Python CNES e autorização
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_cnes*.py'

  migrations:
    name: Validar banco vazio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Iniciar banco local e aplicar todas as migrations
        run: |
          supabase db start
          supabase db reset --local --no-seed
      - name: Ensaiar fluxos SQL integrados sem persistir fixtures
        run: |
          set -euo pipefail
          for scenario in access unit calendar distribution registration legacy block4 block5 block6 cnes rh rhcalendar rhleaves rhrevisions rhfilters rhreturn cnespdf rhpolicy rhpolicyworkflow cnesintegration; do
            node scripts/prepare-workflow-rehearsal.mjs "$scenario" | docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          done
          docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < tests/block-three-rehearsal.sql
          (printf 'begin;\n'; cat tests/cnes-api-rehearsal.sql; printf '\nrollback;\n') | docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          (printf 'begin;\n'; cat tests/calendar-year-dayoff-rehearsal.sql; printf '\nrollback;\n') | docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          (printf 'begin;\n'; cat tests/scoped-holidays-rehearsal.sql; printf '\nrollback;\n') | docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          (printf 'begin;\n'; cat tests/final-absence-rehearsal.sql; printf '\nrollback;\n') | docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1
      - name: Restaurar backup sintético em banco novo e comparar integridade
        env:
          SGF_ISOLATED_DATABASE: 'yes'
        run: node scripts/verify-database-rebuild.mjs
