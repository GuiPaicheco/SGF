name: Testes do SGF

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Executar testes automatizados
        run: node --test tests/*.test.mjs

  migrations:
    name: Validar banco vazio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Iniciar banco local e aplicar todas as migrations
        run: |
          supabase db start
          supabase db reset --local --no-seed
      - name: Ensaiar fluxos SQL integrados sem persistir fixtures
        run: |
          set -euo pipefail
          for scenario in access unit calendar distribution registration legacy block4 block5 block6 cnes rh rhcalendar rhleaves rhrevisions rhfilters rhreturn cnespdf rhpolicy rhpolicyworkflow; do
            node scripts/prepare-workflow-rehearsal.mjs "$scenario" | docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          done
          docker exec -i supabase_db_sgf psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < tests/block-three-rehearsal.sql
      - name: Restaurar backup sintético em banco novo e comparar integridade
        env:
          SGF_ISOLATED_DATABASE: 'yes'
        run: node scripts/verify-database-rebuild.mjs
