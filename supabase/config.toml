project_id = "sgf"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

# Login e cadastro públicos; operações privadas verificam JWT e getUser.
[functions.access-auth]
verify_jwt = false

# Verifica a identidade com getUser e revalida Administrador/contexto no corpo.
[functions.manage-cnes]
verify_jwt = false

[functions.manage-rh]
verify_jwt = false
